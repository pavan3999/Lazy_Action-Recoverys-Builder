name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest'
        required: true
        default: 'https://github.com/SHRP/manifest.git'

      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
          - shrp-12.1
          - v3_11.0
          - v3_9.0

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/AltafYafai/device_xiaomi_sky-recovery'

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'TWRP'

      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/sky'

      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'sky'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean

      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'recovery/root'
        type: choice
        options:
          - recovery/root
          - system/bin/qseecomd
          - system/bin/android.hardware.gatekeeper@1.0-service-qti
          - system/bin/android.hardware.keymaster@4.0-service-qti
          - system/bin/android.hardware.keymaster@4.1-service-qti

jobs:
  build:
    name: Build SHRP by ${{ github.actor }}
    runs-on: ubuntu-24.04

    if: github.event.repository.owner.id == github.event.sender.id

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Display Inputs
        run: |
          echo "Displaying variables/inputs."
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}image"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare the environment
        run: |
          set -eux

          sudo add-apt-repository -y universe
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            gperf \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            lz4 \
            libncurses-dev \
            libsdl1.2-compat-dev \
            libwxgtk3.2-dev \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libtinfo6 \
            libgflags-dev \
            python3 \
            python-is-python3 \
            curl \
            git \
            unzip \
            zip

      - name: Install Python 2.7 for legacy SHRP scripts
        run: |
          set -euxo pipefail

          APPIMAGE="${RUNNER_TEMP}/python2.7.18.AppImage"
          EXTRACT_DIR="${RUNNER_TEMP}/python2.7-extract"

          curl -fL --retry 3 \
            "https://github.com/niess/python-appimage/releases/download/python2.7/python2.7.18-cp27-cp27m-manylinux1_x86_64.AppImage" \
            -o "${APPIMAGE}"

          chmod +x "${APPIMAGE}"
          mkdir -p "${EXTRACT_DIR}"

          (
            cd "${EXTRACT_DIR}"
            "${APPIMAGE}" --appimage-extract
          )

          sudo rm -rf /opt/python2.7
          sudo mv "${EXTRACT_DIR}/squashfs-root" /opt/python2.7

          sudo tee /usr/local/bin/python2.7 >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /opt/python2.7/AppRun "$@"
          EOF

          sudo chmod 0755 /usr/local/bin/python2.7

          python2.7 --version
          python2.7 -c 'import sys; print(sys.version)'

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Git-Repo
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          sudo ln -sf "${HOME}/bin/repo" /usr/bin/repo

      - name: Initialize Repo
        run: |
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "lazycodebuilder"
          git config --global user.email "154446636+lazycodebuilder@users.noreply.github.com"

          repo init --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Set build target for upload
        run: |
          case "${{ inputs.BUILD_TARGET }}" in
            recovery)
              echo "BUILD_TARGET_NAME=recovery" >> "$GITHUB_ENV"
              ;;
            boot)
              echo "BUILD_TARGET_NAME=boot" >> "$GITHUB_ENV"
              ;;
            vendorboot)
              echo "BUILD_TARGET_NAME=vendor_boot" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported build target"
              exit 1
              ;;
          esac

      - name: Repo Sync
        run: |
          cd android-recovery
          repo sync -j"$(nproc --all)" --force-sync

      - name: Clone Device Tree
        run: |
          cd android-recovery

          git clone \
            "${{ inputs.DEVICE_TREE }}" \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "./${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check Build Makefile
        run: |
          cd android-recovery

          if [ -f "${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          elif [ -f "${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          else
            echo "ERROR: No recovery makefile found!"
            exit 1
          fi

      - name: Building Image
        run: |
          cd android-recovery

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${DEVICE_MAKEFILE}-eng"

          make clean

          mka "${{ inputs.BUILD_TARGET }}image" -j"$(nproc --all)"

          echo "Done building ${{ inputs.BUILD_TARGET }} image"

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/SHRP*.zip
          name: Unofficial SHRP For ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})

      - name: Run LDCheck
        if: inputs.LDCHECK == true
        continue-on-error: true
        run: |
          cd tools

          PRODUCT_DIR="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"

          mv -n libneeds "${PRODUCT_DIR}/recovery/root/"
          mv -n ldcheck "${PRODUCT_DIR}/recovery/root/"

          cd "${PRODUCT_DIR}/recovery/root"

          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ inputs.LDCHECKPATH }}"

          echo "Done checking missing dependencies. Review and reconfigure your tree."
