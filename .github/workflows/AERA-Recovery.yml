name: AERA Recovery [sky]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'AERA Android manifest URL'
        required: true
        default: 'https://github.com/AERA-Recovery/android_manifest.git'
        type: string

      MANIFEST_BRANCH:
        description: 'AERA manifest branch'
        required: true
        default: 'aera-16.0'
        type: string

      DEVICE_TREE:
        description: 'Recovery device tree Git URL'
        required: true
        default: 'https://github.com/Adithy4n/recovery_device_xiaomi_sky'
        type: string

      DEVICE_TREE_BRANCH:
        description: 'Recovery device tree branch'
        required: true
        default: 'fox_16.0'
        type: string

      DEVICE_PATH:
        description: 'Device tree checkout path'
        required: true
        default: 'device/xiaomi/sky'
        type: string

      DEVICE_NAME:
        description: 'Device codename / output product directory'
        required: true
        default: 'sky'
        type: string

      LUNCH_TARGET:
        description: 'Full AERA lunch target'
        required: true
        default: 'twrp_sky-bp2a-eng'
        type: string

      BUILD_JOBS:
        description: 'Build parallel jobs (keep low on GitHub-hosted runners)'
        required: true
        default: '2'
        type: string

      MAX_RECOVERY_SIZE:
        description: 'Maximum recovery.img size in bytes; use 0 to disable the size limit'
        required: true
        default: '104857600'
        type: string

permissions:
  contents: read

concurrency:
  group: aera-${{ inputs.DEVICE_NAME }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AERA Recovery for ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      MANIFEST: ${{ inputs.MANIFEST }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      LUNCH_TARGET: ${{ inputs.LUNCH_TARGET }}
      BUILD_JOBS: ${{ inputs.BUILD_JOBS }}
      MAX_RECOVERY_SIZE: ${{ inputs.MAX_RECOVERY_SIZE }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Display and validate build inputs
        run: |
          set -eux
          echo "Manifest: $MANIFEST"
          echo "Manifest branch: $MANIFEST_BRANCH"
          echo "Device tree: $DEVICE_TREE"
          echo "Device tree branch: $DEVICE_TREE_BRANCH"
          echo "Device path: $DEVICE_PATH"
          echo "Device codename: $DEVICE_NAME"
          echo "Lunch target: $LUNCH_TARGET"
          echo "Build jobs: $BUILD_JOBS"
          echo "Maximum recovery image size: $MAX_RECOVERY_SIZE bytes"

          case "$DEVICE_PATH" in
            ""|/*|*".."*) echo "::error::DEVICE_PATH must be a safe relative path."; exit 1 ;;
          esac
          case "$DEVICE_NAME" in
            ""|*[!A-Za-z0-9_-]*) echo "::error::Invalid DEVICE_NAME."; exit 1 ;;
          esac
          case "$BUILD_JOBS" in
            ""|*[!0-9]*) echo "::error::BUILD_JOBS must be numeric."; exit 1 ;;
          esac
          [ "$BUILD_JOBS" -ge 1 ] && [ "$BUILD_JOBS" -le 8 ]
          case "$MAX_RECOVERY_SIZE" in
            ""|*[!0-9]*) echo "::error::MAX_RECOVERY_SIZE must be numeric."; exit 1 ;;
          esac
          test -n "$MANIFEST"
          test -n "$MANIFEST_BRANCH"
          test -n "$DEVICE_TREE"
          test -n "$DEVICE_TREE_BRANCH"
          test -n "$LUNCH_TARGET"
      - name: Free runner space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev libffi-dev libgflags-dev libgl1-mesa-dev \
            liblz4-tool libncurses-dev libncurses6 libssl-dev libtinfo6 \
            libxml2 libxml2-utils lz4 lzop pngcrush python3 python-is-python3 \
            qemu-user-static rsync schedtool squashfs-tools unzip xsltproc zip \
            zlib1g-dev libsdl1.2-compat-dev libwxgtk3.2-dev

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repo tool
        run: |
          set -eux
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: Initialize AERA Android 16 source
        run: |
          set -eux
          mkdir -p android-aera
          cd android-aera
          git config --global user.name "AERA Recovery Builder"
          git config --global user.email "154446636+pavan3999@users.noreply.github.com"
          repo init -u "$MANIFEST" -b "$MANIFEST_BRANCH" --depth=1

      # Restore Git object databases from the most recent AERA cache.
      # The manifest is deliberately NOT cached: repo init above refreshes it
      # from aera-16.0 on every run, so newly added/removed projects are noticed.
      - name: Restore AERA Git source cache
        uses: actions/cache@v6
        with:
          path: |
            android-aera/.repo/project-objects
            android-aera/.repo/projects
          key: aera-android16-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aera-android16-${{ runner.os }}-

      - name: Sync AERA source
        run: |
          set -eux
          cd android-aera

          echo "=== DISK BEFORE SYNC ==="
          df -h /
          df -h .
          echo "=== AERA SOURCE CACHE SIZE ==="
          du -sh .repo 2>/dev/null || true
          echo "=== MEMORY AND SWAP BEFORE SYNC ==="
          free -h
          swapon --show

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"

          echo "=== DISK AFTER SYNC ==="
          df -h /
          df -h .
          echo "=== CHECKED-OUT SOURCE SIZE ==="
          du -sh . 2>/dev/null || true

      - name: Clone recovery device tree
        run: |
          set -eux
          cd android-aera
          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --single-branch --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE" "$DEVICE_PATH"
          echo "DEVICE_TREE_COMMIT=$(git -C "$DEVICE_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"

          test -s "$DEVICE_PATH/BoardConfig.mk"
          test -s "$DEVICE_PATH/device.mk"
          test -s "$DEVICE_PATH/AndroidProducts.mk"

          echo "=== DEVICE TREE COMMIT ==="
          git -C "$DEVICE_PATH" log -1 --format='%H%n%cs%n%s'
          echo "=== AERA CONFIG FILES ==="
          find "$DEVICE_PATH" -maxdepth 2 -type f | grep -Ei 'aera|vendorsetup|twrp_' || true

      - name: Validate AERA product configuration
        run: |
          set -eux
          cd android-aera
          if ! grep -R -Fq "$LUNCH_TARGET" "$DEVICE_PATH/AndroidProducts.mk" "$DEVICE_PATH"; then
            echo "::error::Lunch target '$LUNCH_TARGET' was not found in the selected device tree."
            exit 1
          fi
          if [ -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            echo "Device vendorsetup.sh found."
          else
            echo "::warning::No vendorsetup.sh found; continuing."
          fi

      - name: Build AERA recovery image
        run: |
          # Android envsetup/lunch scripts expect unset variables to be allowed.
          # Do not enable Bash nounset (-u) in this step.
          set -eo pipefail
          cd android-aera

          echo "=== PRE-BUILD RESOURCE DIAGNOSTICS ==="
          date -u
          free -h
          swapon --show
          df -h /
          echo "--- cgroup memory limit/current ---"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          cat /sys/fs/cgroup/memory.current 2>/dev/null || true
          echo "--- cgroup memory events ---"
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true

          # Required by AERA: set before envsetup so device-specific exports
          # cannot leak between products.
          export AERA_BUILD_DEVICE="$DEVICE_NAME"
          source build/envsetup.sh
          if [ -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            source "$DEVICE_PATH/vendorsetup.sh" "$DEVICE_NAME"
          fi

          lunch "$LUNCH_TARGET"

          # Use lower parallelism on the 16 GB hosted runner. Soong's
          # Android.bp analysis is memory-intensive even before Ninja builds.
          set +e
          mka -j"$BUILD_JOBS" adbd recoveryimage
          BUILD_STATUS=$?
          set -e

          echo "=== POST-BUILD RESOURCE DIAGNOSTICS ==="
          date -u
          free -h
          swapon --show
          df -h /
          echo "--- cgroup memory events ---"
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          echo "--- cgroup memory peak ---"
          cat /sys/fs/cgroup/memory.peak 2>/dev/null || true

          exit "$BUILD_STATUS"

      - name: Verify recovery image
        run: |
          set -eux
          IMAGE="android-aera/out/target/product/$DEVICE_NAME/recovery.img"
          test -s "$IMAGE"

          SIZE="$(stat -c '%s' "$IMAGE")"
          echo "Recovery image size: $SIZE bytes"
          if [ "$MAX_RECOVERY_SIZE" -gt 0 ] && [ "$SIZE" -gt "$MAX_RECOVERY_SIZE" ]; then
            echo "::error::recovery.img exceeds the configured maximum of $MAX_RECOVERY_SIZE bytes."
            exit 1
          fi

          sha256sum "$IMAGE" | tee recovery-image.sha256
          {
            echo "### AERA Recovery build — $DEVICE_NAME"
            echo
            echo "- Manifest: $MANIFEST ($MANIFEST_BRANCH)"
            echo "- Device tree: $DEVICE_TREE ($DEVICE_TREE_BRANCH)"
            echo "- Device tree commit: `$DEVICE_TREE_COMMIT`"
            echo "- Lunch target: $LUNCH_TARGET"
            echo "- Image size: `$SIZE bytes`"
            echo "- SHA-256:"
            echo
            echo "```"
            cat recovery-image.sha256
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AERA flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AERA-${{ env.DEVICE_NAME }}-flashable
          path: |
            android-aera/out/target/product/${{ env.DEVICE_NAME }}/AERA-*.zip
            android-aera/out/target/product/${{ env.DEVICE_NAME }}/AERA-*.zip.md5
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload AERA recovery images
        uses: actions/upload-artifact@v4
        with:
          name: AERA-${{ env.DEVICE_NAME }}-recovery
          path: |
            android-aera/out/target/product/${{ env.DEVICE_NAME }}/AERA-*.img
            android-aera/out/target/product/${{ env.DEVICE_NAME }}/AERA-*.img.md5
            android-aera/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
            recovery-image.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
