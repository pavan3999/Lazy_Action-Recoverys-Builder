name: AERA Recovery [sky]

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aera-sky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AERA Recovery for sky
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free runner space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev libffi-dev libgflags-dev libgl1-mesa-dev \
            liblz4-tool libncurses-dev libncurses6 libssl-dev libtinfo6 \
            libxml2 libxml2-utils lz4 lzop pngcrush python3 python-is-python3 \
            qemu-user-static rsync schedtool squashfs-tools unzip xsltproc zip \
            zlib1g-dev libsdl1.2-compat-dev libwxgtk3.2-dev

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repo tool
        run: |
          set -eux
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: Initialize AERA Android 16 source
        run: |
          set -eux
          mkdir -p android-aera
          cd android-aera
          git config --global user.name "AERA Recovery Builder"
          git config --global user.email "154446636+pavan3999@users.noreply.github.com"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0

      # Restore Git object databases from the most recent AERA cache.
      # The manifest is deliberately NOT cached: repo init above refreshes it
      # from aera-16.0 on every run, so newly added/removed projects are noticed.
      - name: Restore AERA Git source cache
        uses: actions/cache@v6
        with:
          path: |
            android-aera/.repo/project-objects
            android-aera/.repo/projects
          key: aera-android16-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aera-android16-${{ runner.os }}-

      - name: Sync AERA source
        run: |
          set -eux
          cd android-aera

          echo "=== DISK BEFORE SYNC ==="
          df -h /
          df -h .
          echo "=== AERA SOURCE CACHE SIZE ==="
          du -sh .repo 2>/dev/null || true
          echo "=== MEMORY AND SWAP BEFORE SYNC ==="
          free -h
          swapon --show

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"

          echo "=== DISK AFTER SYNC ==="
          df -h /
          df -h .
          echo "=== CHECKED-OUT SOURCE SIZE ==="
          du -sh . 2>/dev/null || true

      - name: Clone sky recovery device tree
        run: |
          set -eux
          cd android-aera
          git clone --depth=1 -b TWRP \
            https://github.com/AltafYafai/device_xiaomi_sky-recovery.git \
            device/xiaomi/sky
          echo "DEVICE_TREE_COMMIT=$(git -C device/xiaomi/sky rev-parse HEAD)" >> "$GITHUB_ENV"

          test -f device/xiaomi/sky/BoardConfig.mk
          test -f device/xiaomi/sky/device.mk
          test -f device/xiaomi/sky/twrp_sky.mk
          test -f device/xiaomi/sky/AndroidProducts.mk

      - name: Apply AERA device-tree compatibility overlay
        run: |
          set -eux
          cd android-aera

          # The sky device tree uses PRODUCT_PLATFORM to select the Qualcomm
          # platform. Its matching Android device tree identifies this as parrot.
          if ! grep -q '^PRODUCT_PLATFORM[[:space:]]*:=' device/xiaomi/sky/twrp_sky.mk; then
            sed -i '/^PRODUCT_RELEASE_NAME[[:space:]]*:=/a PRODUCT_PLATFORM := parrot' \
              device/xiaomi/sky/twrp_sky.mk
          fi

          # Android 16 removed the legacy gsi_keys.mk product makefile.
          # Use the Android 16 replacement shipped in build/make.
          sed -i 's@$(SRC_TARGET_DIR)/product/gsi_keys.mk@$(SRC_TARGET_DIR)/product/developer_gsi_keys.mk@g' \
            device/xiaomi/sky/device.mk

          # Android 16 computes BOARD_API_LEVEL from RELEASE_BOARD_API_LEVEL.
          # Keep BOARD_SHIPPING_API_LEVEL (first API level), but remove the
          # legacy manual BOARD_API_LEVEL assignment from the device tree.
          sed -i '/^[[:space:]]*BOARD_API_LEVEL[[:space:]]*:=/d' \
            device/xiaomi/sky/device.mk

          # AERA Android 16 lunch targets use the bp2a release identifier.
          sed -i 's/twrp_sky-eng/twrp_sky-bp2a-eng/g' \
            device/xiaomi/sky/AndroidProducts.mk

          # Translate the device's existing TWRP hardware settings to AERA's
          # public configuration namespace. AERA maps these to its recovery
          # backend internally.
          cat >> device/xiaomi/sky/BoardConfig.mk <<'EOF'

          # AERA Recovery device configuration (generated by the builder)
          AERA_INCLUDE_CRYPTO := true
          AERA_EXCLUDE_APEX := true
          AERA_EXCLUDE_DEFAULT_USB_INIT := true
          AERA_EXTRA_LANGUAGES := true
          AERA_NO_EXFAT_FUSE := true
          AERA_SCREEN_BLANK_ON_BOOT := true
          AERA_INCLUDE_RESETPROP := true
          AERA_INCLUDE_LOGCAT := true
          AERA_USE_SERIALNO_PROPERTY_FOR_DEVICE_ID := true
          AERA_BACKUP_EXCLUSIONS := /data/fonts/files
          AERA_CUSTOM_CPU_TEMP_PATH := /sys/devices/virtual/thermal/thermal_zone34/temp
          AERA_BRIGHTNESS_PATH := /sys/class/backlight/panel0-backlight/brightness
          AERA_DEFAULT_BRIGHTNESS := 547
          AERA_MAX_BRIGHTNESS := 2047
          AERA_QCOM_ATS_OFFSET := 1666528204500
          AERA_OVERRIDE_SYSTEM_PROPS := "ro.build.date.utc;ro.bootimage.build.date.utc=ro.build.date.utc;ro.odm.build.date.utc=ro.odm.build.date.utc;ro.product.build.date.utc=ro.product.build.date.utc;ro.system.build.date.utc=ro.system.build.date.utc;ro.system_ext.build.date.utc=ro.system_ext.build.date.utc;ro.vendor.build.date.utc=ro.vendor.build.date.utc"
          AERA_LOAD_VENDOR_MODULES := "adsp_loader_dlkm.ko camera.ko leds-qpnp-vibrator-ldo.ko"
          AERA_LOAD_VENDOR_MODULES_EXCLUDE_GKI := true
          AERA_SUPPORT_INPUT_AIDL_HAPTICS := true
          AERA_SUPPORT_INPUT_AIDL_HAPTICS_FIX_OFF := true
          AERA_SUPPORT_INPUT_AIDL_HAPTICS_FQNAME := "IVibrator/default"
          AERA_FRAMERATE := 60
          EOF

          # Add AERA's build identity and packaging options to the existing
          # device vendorsetup script without removing its original settings.
          cat >> device/xiaomi/sky/vendorsetup.sh <<'EOF'

          # AERA Recovery packaging configuration
          if [ "$AERA_BUILD_DEVICE" = "sky" ] || [ "$1" = "sky" ]; then
            export LC_ALL="C"
            export AERA_AB_DEVICE=1
            export AERA_VIRTUAL_AB_DEVICE=1
            export AERA_AB_DEVICE_WITH_RECOVERY_PARTITION=1
            export AERA_VANILLA_BUILD=1
            export AERA_PRODUCT_PREFIX=AERA
            export AERA_BUILD_STATUS=Unofficial
            export AERA_BUILD_TYPE=Beta
            export AERA_TARGET_DEVICES="sky"
            export AERA_ENABLE_ROOT_MANAGER=1
            export AERA_USE_BASH_SHELL=1
            export AERA_USE_BUSYBOX_BINARY=1
            export AERA_USE_DATE_BINARY=1
            export AERA_USE_GREP_BINARY=1
            export AERA_USE_LZ4_BINARY=1
            export AERA_USE_SED_BINARY=1
            export AERA_USE_TAR_BINARY=1
            export AERA_USE_UPDATED_MAGISKBOOT=1
            export AERA_USE_XZ_UTILS=1
            export AERA_USE_ZSTD_BINARY=1
            export AERA_USE_FSCK_EROFS_BINARY=1
            export AERA_USE_PATCHELF_BINARY=1
            export AERA_USE_NANO_EDITOR=1
            export AERA_DELETE_AROMAFM=1
            export AERA_SETTINGS_ROOT_DIRECTORY=/data/recovery
            export AERA_MISCELLANEOUS_ROOT_DIRECTORY=/sdcard
            export AERA_ALLOW_EARLY_SETTINGS_LOAD=1
          fi
          EOF

          echo "AERA device-tree overlay applied."
          grep -nE 'PRODUCT_PLATFORM|AERA_INCLUDE_CRYPTO|AERA_BRIGHTNESS_PATH|AERA_AB_DEVICE' \
            device/xiaomi/sky/twrp_sky.mk \
            device/xiaomi/sky/BoardConfig.mk \
            device/xiaomi/sky/vendorsetup.sh

      - name: Build AERA recovery image
        run: |
          # Android envsetup/lunch scripts expect unset variables to be allowed.
          # Do not enable Bash nounset (-u) in this step.
          set -eo pipefail
          cd android-aera

          # Required by AERA: set before envsetup so device-specific exports
          # cannot leak between products.
          export AERA_BUILD_DEVICE=sky
          source build/envsetup.sh
          source device/xiaomi/sky/vendorsetup.sh sky

          lunch twrp_sky-bp2a-eng
          mka -j"$(nproc --all)" adbd recoveryimage

      - name: Verify recovery image
        run: |
          set -eux
          IMAGE="android-aera/out/target/product/sky/recovery.img"
          test -s "$IMAGE"

          SIZE="$(stat -c '%s' "$IMAGE")"
          MAX_SIZE=$((0x06400000))
          echo "Recovery image size: $SIZE bytes"
          echo "Configured recovery partition budget: $MAX_SIZE bytes"

          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::recovery.img exceeds the 100 MiB recovery partition budget."
            exit 1
          fi

          sha256sum "$IMAGE" | tee recovery-image.sha256
          {
            echo "### AERA Recovery build — sky"
            echo
            echo "- Device tree commit: `$DEVICE_TREE_COMMIT`"
            echo "- Image size: `$SIZE bytes`"
            echo "- SHA-256:"
            echo
            echo "```"
            cat recovery-image.sha256
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: AERA-sky-recovery
          path: |
            android-aera/out/target/product/sky/recovery.img
            recovery-image.sha256
          if-no-files-found: error
          retention-days: 14
